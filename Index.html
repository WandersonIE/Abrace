<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrace Vendas - Sistema de Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        .bg-capadocia-card { background-color: #1e1b4b; border: 1px solid #312e81; }
    </style>
</head>
<body class="min-h-screen pb-12">
    <header class="bg-indigo-950 border-b border-indigo-900 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-purple-600 p-2.5 rounded-xl"><i class="fa-solid fa-shop text-white text-xl"></i></div>
                <div>
                    <h1 class="text-2xl font-bold tracking-wider text-purple-300">ABRACE VENDAS</h1>
                    <p class="text-xs text-indigo-300">Gestão de Estoque, Vendas e Comissões</p>
                </div>
            </div>
            <button onclick="abrirModalPDV()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-5 rounded-xl shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-cart-plus"></i> Nova Venda (PDV)
            </button>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-8">
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-capadocia-card p-5 rounded-2xl shadow-md">
                <p class="text-xs font-semibold text-indigo-300 uppercase">Faturamento Total</p>
                <h3 id="kpi-faturamento" class="text-2xl font-bold text-emerald-400 mt-1">R$ 0,00</h3>
            </div>
            <div class="bg-capadocia-card p-5 rounded-2xl shadow-md">
                <p class="text-xs font-semibold text-indigo-300 uppercase">Lucro Líquido</p>
                <h3 id="kpi-lucro" class="text-2xl font-bold text-purple-300 mt-1">R$ 0,00</h3>
            </div>
            <div class="bg-capadocia-card p-5 rounded-2xl shadow-md">
                <p class="text-xs font-semibold text-indigo-300 uppercase">Comissões Pagas</p>
                <h3 id="kpi-comissoes" class="text-2xl font-bold text-amber-400 mt-1">R$ 0,00</h3>
            </div>
            <div class="bg-capadocia-card p-5 rounded-2xl shadow-md">
                <p class="text-xs font-semibold text-indigo-300 uppercase">Total em Estoque</p>
                <h3 id="kpi-estoque" class="text-2xl font-bold text-blue-400 mt-1">0 un.</h3>
            </div>
        </section>
        <section class="bg-capadocia-card p-6 rounded-2xl shadow-md space-y-4">
            <div class="flex justify-between items-center pb-3 border-b border-indigo-900">
                <h2 class="text-lg font-bold text-purple-200"><i class="fa-solid fa-box text-purple-400"></i> Gestão de Produtos</h2>
                <button onclick="abrirModalProduto()" class="bg-indigo-700 text-white text-sm py-1.5 px-3 rounded-lg"><i class="fa-solid fa-plus"></i> Novo Produto</button>
            </div>
            <table class="w-full text-left text-sm text-indigo-100">
                <thead class="bg-indigo-950/70 text-indigo-300 uppercase text-xs">
                    <tr><th class="p-3">Produto</th><th class="p-3">Custo</th><th class="p-3">Venda</th><th class="p-3">Estoque</th><th class="p-3 text-right">Ações</th></tr>
                </thead>
                <tbody id="tabela-produtos" class="divide-y divide-indigo-900/50"></tbody>
            </table>
        </section>
    </main>
    <script>
        let produtos = JSON.parse(localStorage.getItem('abrace_produtos')) || [{ id: 1, nome: 'Café Capadócia', custo: 12, venda: 25, estoque: 40 }];
        let vendedores = JSON.parse(localStorage.getItem('abrace_vendedores')) || [{ id: 1, nome: 'Padrão', comissao: 5 }];
        let vendas = JSON.parse(localStorage.getItem('abrace_vendas')) || [];
        function renderizar() {
            document.getElementById('tabela-produtos').innerHTML = produtos.map(p => `<tr><td class="p-3">${p.nome}</td><td class="p-3">R$ ${p.custo}</td><td class="p-3">R$ ${p.venda}</td><td class="p-3">${p.estoque} un.</td></tr>`).join('');
        }
        renderizar();
    </script>
</body>
</html>
